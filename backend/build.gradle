plugins {
    id 'java'
    id 'application'
    id 'io.quarkus' version '3.7.3'
}

group = 'com.slamperboom'
version = '1.0'

mainClassName = 'com.slamperboom.Main'

application {
    mainModule = 'ResumeBuilder.main'
    mainClass = 'com.slamperboom.Main'
}

java {
    modularity.inferModulePath = true
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'

    implementation 'org.freemarker:freemarker:2.3.31'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.2'

    implementation 'org.jsoup:jsoup:1.20.1'

    implementation "com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10"

    implementation 'com.vladsch.flexmark:flexmark-all:0.64.8'

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    implementation enforcedPlatform(
            "io.quarkus.platform:quarkus-bom:3.7.3"
    )

    implementation 'io.quarkus:quarkus-resteasy-reactive-jackson'
}

def translationsDir = file('src/main/resources/translations')

processResources {
    exclude 'translations/README.md', 'translations/*/_schema.json'
}

tasks.register('syncTranslations', JavaExec) {
    group = 'translations'
    description = 'Adds keys missing from _schema.json to every translation file and warns about keys not in the schema'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.slamperboom.translations.TranslationsSync'
    args translationsDir.absolutePath
}

test {
    useJUnitPlatform()
    // _schema.json is not on the classpath, so tell gradle the schema test depends on it
    inputs.dir translationsDir
    systemProperty 'golden.update', System.getProperty('golden.update', 'false')
}

jar {
    manifest {
        attributes 'Main-class': mainClassName
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}
