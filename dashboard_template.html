<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log dashboard — __SOURCE_NAME__</title>
<style>
  :root{
    --bg:#14161a;
    --panel:#1b1e24;
    --panel-2:#20242c;
    --border:#2a2e37;
    --text:#e7e9ee;
    --text-dim:#8b93a3;
    --text-faint:#5b6270;
    --accent:#4fd1c5;
    --lvl-info:#5b8def;
    --lvl-warn:#e0a73a;
    --lvl-error:#e5484d;
    --lvl-debug:#8b93a3;
    --lvl-trace:#a78bfa;
    --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-sans);
    font-size:14px;
    line-height:1.45;
  }
  a{color:var(--accent);}
  ::selection{background:#2a5f5a;}

  header{
    position:sticky; top:0; z-index:20;
    background:rgba(20,22,26,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
    padding:14px 24px;
  }
  .header-row{
    display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  }
  h1{
    font-size:18px; font-weight:600; margin:0; letter-spacing:-0.01em;
  }
  .meta-tags{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .tag{
    font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim);
    background:var(--panel-2); border:1px solid var(--border);
    padding:2px 8px; border-radius:3px;
  }

  main{padding:20px 24px 60px; max-width:1280px; margin:0 auto;}
  section{margin-bottom:26px;}
  h2{font-size:13px; font-weight:600; color:var(--text-dim); margin:0 0 10px;}

  .stats{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:1px;
    background:var(--border); border:1px solid var(--border); border-radius:5px; overflow:hidden;
  }
  .stat{
    background:var(--panel); padding:12px 16px;
  }
  .stat .n{font-family:var(--font-mono); font-size:22px; font-weight:600; display:block;}
  .stat .l{font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .stat.info .n{color:var(--lvl-info);}
  .stat.warn .n{color:var(--lvl-warn);}
  .stat.error .n{color:var(--lvl-error);}

  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:5px; padding:16px;
  }

  #timeline-svg{width:100%; height:auto; display:block;}
  .legend{display:flex; gap:16px; margin-top:8px; flex-wrap:wrap;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); font-family:var(--font-mono);}
  .legend-dot{width:9px; height:9px; border-radius:2px;}

  /* collapsible "Request statistics" section */
  details.panel-details{margin-bottom:26px;}
  details.panel-details > summary{
    cursor:pointer; font-size:13px; font-weight:600; color:var(--text-dim);
    list-style:none; display:flex; align-items:center; gap:7px; padding:2px 0;
    user-select:none;
  }
  details.panel-details > summary::-webkit-details-marker{display:none;}
  details.panel-details > summary::before{
    content:'▸'; color:var(--accent); display:inline-block; width:10px;
    transition:transform .15s;
  }
  details.panel-details[open] > summary::before{transform:rotate(90deg);}

  .controls-row{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;
  }
  .chips{display:flex; gap:6px;}
  .chip{
    font-family:var(--font-mono); font-size:11.5px; font-weight:600;
    padding:5px 9px; border-radius:3px; cursor:pointer; user-select:none;
    border:1px solid var(--border); background:var(--panel-2); color:var(--text-dim);
    transition:opacity .12s;
  }
  .chip.active[data-lvl=INFO]{color:var(--lvl-info); border-color:var(--lvl-info);}
  .chip.active[data-lvl=WARN]{color:var(--lvl-warn); border-color:var(--lvl-warn);}
  .chip.active[data-lvl=ERROR]{color:var(--lvl-error); border-color:var(--lvl-error);}
  .chip.active[data-lvl=DEBUG]{color:var(--lvl-debug); border-color:var(--lvl-debug);}
  .chip.active[data-lvl=TRACE]{color:var(--lvl-trace); border-color:var(--lvl-trace);}
  .chip:not(.active){opacity:.4;}
  #search{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    border-radius:4px; padding:7px 10px; font-family:var(--font-sans); font-size:13px;
    flex:1; min-width:200px; outline:none;
  }
  #search:focus{border-color:var(--accent);}
  #page-size{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim);
    border-radius:4px; padding:7px 8px; font-family:var(--font-sans); font-size:12.5px; outline:none;
  }

  table{width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:12.5px;}
  thead th{
    text-align:left; font-family:var(--font-sans); font-weight:600; color:var(--text-dim);
    font-size:11.5px; padding:6px 10px; border-bottom:1px solid var(--border); cursor:pointer;
    white-space:nowrap;
  }
  thead th:hover{color:var(--text);}
  thead th.sorted::after{content:" ▾"; color:var(--accent);}
  thead th.sorted.asc::after{content:" ▴";}
  tbody td{padding:6px 10px; border-bottom:1px solid #21242b; vertical-align:top;}
  tbody tr:hover{background:var(--panel-2);}

  .lvl-badge{
    font-weight:700; font-size:11px; padding:1px 6px; border-radius:3px; letter-spacing:.02em;
  }
  .lvl-badge.INFO{color:var(--lvl-info); background:rgba(91,141,239,.12);}
  .lvl-badge.WARN{color:var(--lvl-warn); background:rgba(224,167,58,.14);}
  .lvl-badge.ERROR{color:var(--lvl-error); background:rgba(229,72,77,.14);}
  .lvl-badge.DEBUG{color:var(--lvl-debug); background:rgba(139,147,163,.12);}
  .lvl-badge.TRACE{color:var(--lvl-trace); background:rgba(167,139,250,.14);}

  .status-pill{font-weight:700;}
  .status-pill.ok{color:#4fd18a;}
  .status-pill.redirect{color:var(--lvl-warn);}
  .status-pill.err{color:var(--lvl-error);}

  .lat-cell{display:flex; align-items:center; gap:8px;}
  .lat-bar{height:6px; background:var(--accent); border-radius:2px; opacity:.55;}
  .lat-num{font-variant-numeric:tabular-nums; min-width:52px; text-align:right;}

  .indicator-cell{width:20px; text-align:center; padding-left:6px !important; padding-right:0 !important;}
  .chevron{display:inline-block; color:var(--accent); font-size:11px;}
  .chevron::before{content:'▸';}
  .chevron.open::before{content:'▾';}
  .log-row.has-body{cursor:pointer;}
  .log-row.has-body:hover .msg-cell{color:var(--text);}

  .msg-cell{
    max-width:640px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  tr.expanded .msg-cell{white-space:normal; text-overflow:clip;}
  .body-row td{background:#171a20; padding:0;}
  .body-row pre{
    margin:0; padding:12px 16px; font-size:12px; color:var(--text-dim);
    white-space:pre-wrap; word-break:break-word; max-height:360px; overflow:auto;
  }
  .hint{color:var(--text-faint); font-size:11.5px; font-weight:400;}

  .pagination{
    display:flex; align-items:center; justify-content:center; gap:14px; margin-top:14px;
  }
  .pagination button{
    background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:7px 16px; border-radius:4px; cursor:pointer; font-family:var(--font-sans); font-size:12.5px;
  }
  .pagination button:hover:not(:disabled){border-color:var(--accent); color:var(--accent);}
  .pagination button:disabled{opacity:.35; cursor:default;}
  .pagination span{color:var(--text-dim); font-size:12.5px; font-family:var(--font-mono);}

  .empty{color:var(--text-faint); padding:20px; text-align:center; font-size:13px;}

  @media (max-width: 700px){
    .msg-cell{max-width:220px;}
    #search{width:100%;}
  }
</style>
</head>
<body>

<header>
  <div class="header-row">
    <h1>Log dashboard</h1>
    <div class="meta-tags" id="meta-tags"></div>
  </div>
</header>

<main>
  <section class="stats" id="stats"></section>

  <section>
    <h2>Timeline (by level)</h2>
    <div class="panel">
      <svg id="timeline-svg" viewBox="0 0 1000 220"></svg>
      <div class="legend" id="timeline-legend"></div>
    </div>
  </section>

  <details class="panel-details" id="requests-details">
    <summary>Request statistics <span class="hint" id="requests-count-hint"></span></summary>
    <div class="panel" style="padding:0; margin-top:10px;">
      <table id="requests-table">
        <thead><tr>
          <th data-key="method">Method</th>
          <th data-key="path">Path</th>
          <th data-key="status">Status</th>
          <th data-key="latency_ms" class="sorted">Latency</th>
          <th data-key="ts">Time</th>
        </tr></thead>
        <tbody id="requests-tbody"></tbody>
      </table>
    </div>
  </details>

  <section>
    <h2>Log entries <span class="hint" id="logs-count-hint"></span></h2>

    <div class="controls-row">
      <div class="chips" id="chips"></div>
      <input id="search" type="text" placeholder="Search message, logger, thread…">
      <select id="page-size">
        <option value="25">25 / page</option>
        <option value="50" selected>50 / page</option>
        <option value="100">100 / page</option>
        <option value="200">200 / page</option>
        <option value="500">500 / page</option>
      </select>
    </div>

    <div class="panel" style="padding:0;">
      <table>
        <thead><tr>
          <th class="indicator-cell"></th>
          <th style="width:110px;">Time</th>
          <th style="width:70px;">Level</th>
          <th style="width:170px;">Logger</th>
          <th style="width:150px;">Thread</th>
          <th>Message</th>
        </tr></thead>
        <tbody id="logs-tbody"></tbody>
      </table>
      <div id="logs-empty" class="empty" style="display:none;">No entries match the current filter.</div>
    </div>

    <div class="pagination">
      <button id="page-prev">‹ Prev</button>
      <span id="page-indicator"></span>
      <button id="page-next">Next ›</button>
    </div>
  </section>
</main>

<script>
const DATA = __DATA_JSON__;

const LEVEL_ORDER = ['TRACE','DEBUG','INFO','WARN','ERROR'];
const LEVEL_COLOR = {
  TRACE:'var(--lvl-trace)', DEBUG:'var(--lvl-debug)', INFO:'var(--lvl-info)',
  WARN:'var(--lvl-warn)', ERROR:'var(--lvl-error)'
};

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

// ---------- header meta + stats ----------
function renderMeta(){
  const s = DATA.summary;
  const tags = [
    `${esc(DATA.source)}`,
    s.host ? `host: ${esc(s.host)}` : null,
    s.proc ? `proc: ${esc(s.proc)}` : null,
    (s.start && s.end) ? `${esc(s.start.slice(0,19))} → ${esc(s.end.slice(11,19))}` : null,
  ].filter(Boolean);
  document.getElementById('meta-tags').innerHTML =
    tags.map(t=>`<span class="tag">${t}</span>`).join('');
}

function renderStats(){
  const s = DATA.summary;
  const items = [
    {n:s.total, l:'Total entries', cls:''},
    {n:s.levels.ERROR||0, l:'Error', cls:'error'},
    {n:s.levels.WARN||0, l:'Warn', cls:'warn'},
    {n:s.levels.INFO||0, l:'Info', cls:'info'},
    {n:s.requests, l:'HTTP requests', cls:''},
    {n:s.avg_latency!=null ? s.avg_latency+' ms' : '—', l:'Avg latency', cls:''},
    {n:s.loggers, l:'Loggers', cls:''},
    {n:s.threads, l:'Threads', cls:''},
  ];
  document.getElementById('stats').innerHTML = items.map(i=>
    `<div class="stat ${i.cls}"><span class="n">${i.n}</span><span class="l">${i.l}</span></div>`
  ).join('');
}

// ---------- timeline (full chart with axes) ----------
function niceTicks(maxValue, tickCount){
  if(maxValue<=0) return {step:1, niceMax:1};
  const rawStep = maxValue/tickCount;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep/mag;
  const niceNorm = norm<=1 ? 1 : norm<=2 ? 2 : norm<=5 ? 5 : 10;
  const step = niceNorm*mag;
  const niceMax = Math.ceil(maxValue/step)*step;
  return {step, niceMax};
}

function renderTimeline(){
  const tl = DATA.timeline;
  const svg = document.getElementById('timeline-svg');
  const legendEl = document.getElementById('timeline-legend');
  const n = tl.labels.length;
  if(!n){ svg.innerHTML=''; return; }

  const levels = LEVEL_ORDER.filter(l => tl.series[l]);
  const totals = tl.labels.map((_,i)=> levels.reduce((a,l)=>a+tl.series[l][i],0));
  const rawMax = Math.max(...totals, 1);
  const {step, niceMax} = niceTicks(rawMax, 4);

  const W=1000, H=220;
  const marginL=42, marginR=10, marginT=10, marginB=30;
  const chartW = W-marginL-marginR, chartH = H-marginT-marginB;
  const gap = n>80 ? 0.5 : 2;
  const barW = chartW/n - gap;

  let parts = [];

  // horizontal gridlines + y-axis value labels
  const tickCount = Math.round(niceMax/step);
  for(let t=0;t<=tickCount;t++){
    const val = t*step;
    const y = marginT + chartH - (val/niceMax)*chartH;
    parts.push(`<line x1="${marginL}" y1="${y.toFixed(1)}" x2="${W-marginR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>`);
    parts.push(`<text x="${marginL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-dim)" font-family="var(--font-mono)">${val}</text>`);
  }
  // axis lines
  parts.push(`<line x1="${marginL}" y1="${marginT}" x2="${marginL}" y2="${marginT+chartH}" stroke="var(--border)" stroke-width="1"/>`);
  parts.push(`<line x1="${marginL}" y1="${marginT+chartH}" x2="${W-marginR}" y2="${marginT+chartH}" stroke="var(--border)" stroke-width="1"/>`);

  // stacked bars
  for(let i=0;i<n;i++){
    let y = marginT+chartH;
    const x = marginL + i*(barW+gap);
    for(const lvl of levels){
      const v = tl.series[lvl][i];
      if(!v) continue;
      const h = (v/niceMax)*chartH;
      y -= h;
      parts.push(`<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${Math.max(barW,0.6).toFixed(2)}" height="${h.toFixed(2)}" fill="${LEVEL_COLOR[lvl]}"><title>${tl.labels[i]} · ${lvl}: ${v}</title></rect>`);
    }
  }

  // x-axis: evenly spaced time labels
  const xTickCount = Math.min(7, n);
  for(let k=0;k<xTickCount;k++){
    const idx = Math.round(k*(n-1)/Math.max(xTickCount-1,1));
    const x = marginL + idx*(barW+gap) + barW/2;
    parts.push(`<line x1="${x.toFixed(1)}" y1="${marginT+chartH}" x2="${x.toFixed(1)}" y2="${marginT+chartH+4}" stroke="var(--border)"/>`);
    parts.push(`<text x="${x.toFixed(1)}" y="${marginT+chartH+16}" text-anchor="middle" font-size="10" fill="var(--text-dim)" font-family="var(--font-mono)">${tl.labels[idx]}</text>`);
  }

  svg.innerHTML = parts.join('');
  legendEl.innerHTML = levels.map(l=>
    `<div class="legend-item"><span class="legend-dot" style="background:${LEVEL_COLOR[l]}"></span>${l} · ${DATA.summary.levels[l]||0}</div>`
  ).join('') + `<div class="legend-item">bucket size: ${tl.bucket_seconds}s</div>`;
}

// ---------- level chips ----------
const activeLevels = new Set(Object.keys(DATA.summary.levels));
function renderChips(){
  const levels = LEVEL_ORDER.filter(l => DATA.summary.levels[l]);
  document.getElementById('chips').innerHTML = levels.map(l =>
    `<div class="chip active" data-lvl="${l}">${l}</div>`
  ).join('');
  document.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const lvl = chip.dataset.lvl;
      if(activeLevels.has(lvl)){ activeLevels.delete(lvl); chip.classList.remove('active'); }
      else{ activeLevels.add(lvl); chip.classList.add('active'); }
      currentPage = 1; renderLogs();
    });
  });
}

// ---------- request statistics ----------
let reqSort = {key:'latency_ms', dir:'desc'};
function statusClass(status){
  if(status==null) return '';
  if(status>=500 || status>=400) return 'err';
  if(status>=300) return 'redirect';
  return 'ok';
}
function renderRequests(){
  const rows = [...DATA.requests];
  document.getElementById('requests-count-hint').textContent = `(${rows.length})`;
  if(!rows.length){
    document.getElementById('requests-details').style.display = 'none';
    return;
  }
  const {key, dir} = reqSort;
  rows.sort((a,b)=>{
    let av=a[key], bv=b[key];
    if(av==null) av = -Infinity; if(bv==null) bv = -Infinity;
    if(av<bv) return dir==='asc'?-1:1;
    if(av>bv) return dir==='asc'?1:-1;
    return 0;
  });
  const maxLat = Math.max(...rows.map(r=>r.latency_ms||0), 1);
  document.getElementById('requests-tbody').innerHTML = rows.slice(0,300).map(r=>{
    const latPct = r.latency_ms!=null ? Math.min(100, (r.latency_ms/maxLat)*100) : 0;
    return `<tr>
      <td>${esc(r.method)}</td>
      <td>${esc(r.path)}</td>
      <td><span class="status-pill ${statusClass(r.status)}">${r.status??'—'}</span></td>
      <td><div class="lat-cell"><div class="lat-bar" style="width:${latPct}%"></div><span class="lat-num">${r.latency_ms!=null ? r.latency_ms+' ms' : '—'}</span></div></td>
      <td>${esc((r.ts||'').slice(11))}</td>
    </tr>`;
  }).join('');
}
document.querySelectorAll('#requests-table thead th').forEach(th=>{
  th.addEventListener('click', ()=>{
    const key = th.dataset.key;
    if(reqSort.key===key){ reqSort.dir = reqSort.dir==='asc'?'desc':'asc'; }
    else{ reqSort = {key, dir:'desc'}; }
    document.querySelectorAll('#requests-table thead th').forEach(t=>t.classList.remove('sorted','asc'));
    th.classList.add('sorted'); if(reqSort.dir==='asc') th.classList.add('asc');
    renderRequests();
  });
});

// ---------- logs table (paginated) ----------
let currentPage = 1;
let pageSize = 50;
let searchQuery = '';

function matches(e){
  if(!activeLevels.has(e.level)) return false;
  if(!searchQuery) return true;
  const hay = (e.message+' '+e.logger+' '+e.thread+' '+(e.body||'')).toLowerCase();
  return hay.includes(searchQuery);
}

function shortLogger(l){
  if(!l) return l;
  const parts = l.split('.');
  return parts.length > 2 ? '…' + parts.slice(-2).join('.') : l;
}

function renderLogs(){
  const filtered = DATA.entries.filter(matches);
  const totalPages = Math.max(1, Math.ceil(filtered.length/pageSize));
  currentPage = Math.min(Math.max(currentPage,1), totalPages);
  const start = (currentPage-1)*pageSize;
  const pageItems = filtered.slice(start, start+pageSize);

  const tbody = document.getElementById('logs-tbody');
  document.getElementById('logs-empty').style.display = filtered.length ? 'none' : 'block';

  tbody.innerHTML = pageItems.map((e, idx) => {
    const hasBody = !!e.body;
    const rowId = `row-${idx}`;
    let rows = `<tr class="log-row ${hasBody?'has-body':''}" data-idx="${idx}">
      <td class="indicator-cell">${hasBody ? '<span class="chevron"></span>' : ''}</td>
      <td>${esc((e.ts||'').slice(11))}</td>
      <td><span class="lvl-badge ${e.level}">${e.level}</span></td>
      <td title="${esc(e.logger)}">${esc(shortLogger(e.logger))}</td>
      <td>${esc(e.thread)}</td>
      <td class="msg-cell">${esc(e.message)}</td>
    </tr>`;
    if(hasBody){
      rows += `<tr class="body-row" id="${rowId}" style="display:none;"><td colspan="6"><pre>${esc(e.body)}</pre></td></tr>`;
    }
    return rows;
  }).join('');

  tbody.querySelectorAll('.log-row.has-body').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      const idx = tr.dataset.idx;
      const bodyRow = document.getElementById(`row-${idx}`);
      if(!bodyRow) return;
      const isOpen = bodyRow.style.display !== 'none';
      bodyRow.style.display = isOpen ? 'none' : 'table-row';
      tr.classList.toggle('expanded', !isOpen);
      const chevron = tr.querySelector('.chevron');
      if(chevron) chevron.classList.toggle('open', !isOpen);
    });
  });

  const shownFrom = filtered.length ? start+1 : 0;
  const shownTo = Math.min(start+pageSize, filtered.length);
  document.getElementById('logs-count-hint').textContent =
    `— showing ${shownFrom}–${shownTo} of ${filtered.length}`;
  document.getElementById('page-indicator').textContent = `Page ${currentPage} / ${totalPages}`;
  document.getElementById('page-prev').disabled = currentPage <= 1;
  document.getElementById('page-next').disabled = currentPage >= totalPages;
}

document.getElementById('page-prev').addEventListener('click', ()=>{ currentPage--; renderLogs(); });
document.getElementById('page-next').addEventListener('click', ()=>{ currentPage++; renderLogs(); });
document.getElementById('page-size').addEventListener('change', (e)=>{
  pageSize = parseInt(e.target.value, 10);
  currentPage = 1;
  renderLogs();
});

let searchTimer;
document.getElementById('search').addEventListener('input', (e)=>{
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(()=>{
    searchQuery = v.trim().toLowerCase();
    currentPage = 1;
    renderLogs();
  }, 120);
});

// ---------- init ----------
renderMeta();
renderStats();
renderTimeline();
renderChips();
renderRequests();
renderLogs();
</script>
</body>
</html>
